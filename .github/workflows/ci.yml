name: CI

on:
  # `dev` is the integration branch; `main` only ever receives deliberate merges.
  push:
    branches: [main, dev]
  pull_request:

# A new push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes or deploys, so nothing here needs a writable token.
# The default is whatever the organization hands out, which for this repo is
# more than a check-only workflow should hold.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Without this a step that never exits holds its runner for the 360-minute
    # default before GitHub cancels it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The contract floor, the latest of its major, and the current LTS. Node 20 and 22.0–22.12 are
        # deliberately absent: `PRD.md` §8 puts both Node rows at 22.13.0 and FR-41 names those versions as
        # not supported, so a job running there measures a runtime the contract excludes — and
        # `npm run check:packaging` now fails if a matrix here drops below the floor, because a green job on
        # an unsupported runtime is how a range quietly widens itself.
        node: ['22.13.0', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # FR-45, and FR-58's accessibility half. The same audits run inside `npm test` above, so a violation fails
      # every job; this step is here so the failure has a name on the checks list rather than being line 4,000 of
      # a suite — and because `a11y:record` is what *produces* `a11y/latest.json`, the committed evidence §9 asks
      # for, from a runner rather than from one developer's console.
      - name: Accessibility audit and record (axe-core, WCAG 2.0/2.1/2.2 A+AA)
        run: npm run a11y:record

      - name: Build
        run: npm run build

      # FR-50: "a name that is exported and untagged fails the build" — a build, not a developer's terminal.
      # Until this step existed the check ran only inside `npm run verify`, which no job here calls, so an
      # untagged export could merge green.
      - name: Published API maturity tags
        run: npm run check:maturity

      # §6.2: automated scanning of transitive dependencies, with a documented triage path. Placed here, ahead
      # of the steps that read the tree, because the obligation is that a scan *runs*: a finding the registry
      # reports and nobody has decided is red, and a scan that could not reach the registry is red too rather
      # than skipped. The decisions live in security/dependency-triage.json and the path is SECURITY.md.
      - name: Dependency scan and triage
        run: npm run check:deps

      # §22 of CODE_REFERENCE: the counts that document states about this tree — entry points, source files,
      # fixtures, CI jobs, browser checks — are derived here rather than copied by hand, because every one of
      # them has been wrong at least once and a stale figure reads exactly like a live one. Needs no build.
      - name: Documented counts
        run: npm run check:docs

      # FR-52/FR-58: the requirement register is the status of record, and its own gate is only worth
      # anything if a runner executes it. Reads PRD.md, the register and ROADMAP.md; needs no build.
      - name: Requirement evidence register
        run: npm run check:fr-evidence

      # The tarball is what consumers actually get; a stray import of a file
      # outside `files` type-checks fine and only breaks after publishing.
      - name: Pack
        run: npm pack --dry-run

      # §5.6: the examples a reader copies are compiled against the artifact rather than against `src/`.
      # Every other job here resolves the package through `tsconfig.json`'s `paths`, so a documented name
      # that is not actually published is invisible to all of them and fails only here.
      - name: Examples compile against the packed artifact
        run: npm run check:examples

      # Last, not first: the size ratchet is a reviewed byte budget, and an open decision about bytes must
      # not be able to hide a contract check. Steps after a failing one are skipped, so until #208 is settled
      # a budget step ahead of these would have left `check:examples` unreachable on a runner — which is
      # exactly how FR-52's gap stayed open. It still fails the job; it just no longer blinds what follows.
      - name: Bundle size budget
        run: npm run size

  # Check-only. A push to `main` also starts docs.yml, which builds this same
  # site in order to publish it, so running the job there would duplicate work.
  # PR events carry a refs/pull/* ref, so they still get the check.
  docs:
    name: Build docs
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The docs site renders the built package, not the source, so this job
      # proves the shipped artifact works end to end.
      - name: Build library
        run: npm run build

      # `build:docs` must be a pure build: an earlier version chained
      # `vite preview`, which serves forever, so this step hung for six hours.
      - name: Build docs
        run: npm run build:docs
        env:
          DOC_TARGET: dist

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/dist/
          retention-days: 7

  # The other peer axis. `peerDependencies` advertises `^18.0.0 || ^19.0.0`, and
  # `verify` runs on 19 alone because that is what devDependencies pin — so until
  # this job existed, the 18 half of the advertised range was a sentence nothing
  # re-checked. Same rule as the `consumer` engine matrix: a peer range we cannot
  # actually build against is the mistake that shipped 0.1.0.
  #
  # Measured locally on 2026-09-28 before adding this: with react/react-dom and
  # @types/* swapped to 18.3, `npm run typecheck`, `npm test` (428 tests) and
  # `npm run build` all pass — the source uses `useId` (18+) and `forwardRef`,
  # nothing 19-only. The job is here so that stays true rather than because it
  # was doubtful today.
  react:
    name: React ${{ matrix.react }} (${{ matrix.pin }} patch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both axes at once: the majors are the peer range, and within each major the *minimum supported
        # patch* and the *latest* are different claims. `>=18.0.0 <20.0.0` in `package.json` promises the
        # first page of every major, so a matrix of floating majors proves only the newest patch of each and
        # leaves `18.0.0` — the version a host on an older lockfile actually installs — unmeasured.
        react: ['18', '19']
        pin: ['minimum', 'latest']
    env:
      # The minimum supported patch of a major is its `.0.0`; `latest` lets npm resolve the newest of the
      # major, which is what `react@18` means to npm.
      REACT_VERSION: ${{ matrix.pin == 'minimum' && format('{0}.0.0', matrix.react) || matrix.react }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # `--no-save` keeps `package.json` and the lockfile out of the diff: this
      # job proves the peer range, it does not redefine the development pin. The types track the major, not
      # the patch, because `@types/react` is versioned independently of the runtime and a `.0.0` pin of the
      # types would be a version the types never shipped.
      - name: Swap in React ${{ env.REACT_VERSION }} (${{ matrix.pin }} of ${{ matrix.react }}.x)
        run: |
          set -euo pipefail
          # `npm i` re-resolves the whole tree from `package.json`, so everything this cell must not change
          # has to be named *in the same install* at its lockfile version. Two ways to get that wrong were
          # measured here on 2026-10-06. Leaving the dev tree out: `axe-core` arrived as 4.14.0 over the
          # lockfile's 4.13.0, the 4.14 rule set added `label-content-name-mismatch`, its evaluator throws
          # under jsdom, and the accessibility audit went red in this matrix while staying green in `verify` —
          # a peer job reporting on a different linter than the job it is supposed to be the same suite on.
          # Putting the tree back in a *second* install: `npm i` then re-resolved `react` from `package.json`'s
          # `^19.0.0`, which makes all four cells of the matrix React 19 and the peer range unproven, silently.
          # So the install names both halves, and the step then reads what is actually on disk and fails if
          # this is not the cell the matrix asked for.
          AXIS="react@$REACT_VERSION react-dom@$REACT_VERSION @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}"
          PINS=$(node scripts/pin-tree.mjs pins --exclude=react --exclude=react-dom --exclude=@types/react --exclude=@types/react-dom)
          npm i --no-save --no-package-lock --no-audit --no-fund $AXIS $PINS > /dev/null
          # The same script the `browser` job uses for its axis, for the same reason: two copies of this
          # derivation is how a peer job ends up certifying a tree nobody else ran (#244).
          node scripts/pin-tree.mjs check --major=react=${{ matrix.react }} --major=react-dom=${{ matrix.react }} --major=@types/react=${{ matrix.react }} --major=@types/react-dom=${{ matrix.react }}

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  consumer:
    name: Consumer build (Vite, pdfjs-dist ${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Two rows, because FR-48 asks for both ends of the range we advertise. The floor is
        # `6.2.108` — `^6.2.108` rather than `^6` so CI proves the CVE-2026-16633 floor we advertise and not
        # an unpatched 6.0/6.1 — and the second is the latest supported 6.x, pinned to an exact version so a
        # green run means "this pair was built against", never "whatever npm served today". Refreshed at a
        # release close, not opportunistically: v5 is absent because AnnotationEditorUIManager's positional
        # arguments are ordered differently before 5.7 — see ROADMAP §Policy conflicts.
        engine: ['6.2.108', '6.4.299']
    env:
      PDFJS_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # FR-53's discovery half, and the reason it lives here rather than in `verify`: a caret range grows by
      # itself, so the day npm serves a second member of `@cantoo/pdf-lib: ^2.11.1`, the contract in
      # `src/lib/pdf-write.peer-contract.test.ts` stops covering the promise this package publishes — and
      # nothing in the suite can see it, because the suite only ever reads the peer in the tree. This asks npm
      # what the advertised range resolves to now and fails if that is not the proven pin, with the command that
      # re-runs the contract in the message. It needs the network, which is also why `check:tarball` is out of
      # `verify`.
      - name: Writer peer range still resolves to the proven version
        run: npm run check:writer-peer

      - name: Build library
        run: npm run build

      - name: Pack
        run: npm pack

      # `tsconfig.json` maps `pdfjs-react-reader` onto its own source and the docs
      # alias to `../src`, so every other job here resolves the package locally
      # and a packaging defect can only surface against the installed tarball.
      # That is how 0.1.0 shipped a worker URL no bundler could rewrite.
      - name: Install the packed tarball into a throwaway app
        run: |
          set -euo pipefail
          rm -rf /tmp/consumer && mkdir -p /tmp/consumer
          cp scripts/consumer-smoke/index.html scripts/consumer-smoke/tsconfig.json /tmp/consumer/
          cp -r scripts/consumer-smoke/src /tmp/consumer/src
          cd /tmp/consumer
          npm init -y > /dev/null
          npm i --no-audit --no-fund "$GITHUB_WORKSPACE"/pdfjs-react-reader-*.tgz \
            "pdfjs-dist@$PDFJS_ENGINE" react react-dom > /dev/null
          npm i -D --no-audit --no-fund vite typescript @types/react @types/react-dom > /dev/null

      # Tripwire for the 0.1.0 defect. Vite rewrites a bare `new URL()` specifier
      # when building but not while serving modules in dev, so a bare-only lookup
      # 404s on every consumer's dev server while still passing the build below.
      # The relative form must stay present and tried first.
      - name: Assert the worker specifier is bundler-safe
        run: |
          set -euo pipefail
          grep -q 'new URL("../../pdfjs-dist/build/pdf.worker.min.mjs", import.meta.url)' \
            dist/*.js || { echo 'the relative worker specifier is missing from dist/'; exit 1; }

      # Asserts the shipped .d.ts files work and that the CSS subpath is importable
      # by a plain tsc build (`types: []`, no vite/client shim).
      - name: Type check the consumer
        run: cd /tmp/consumer && ./node_modules/.bin/tsc -p tsconfig.json

      - name: Build the consumer
        run: cd /tmp/consumer && ./node_modules/.bin/vite build

      # Packaging health only: this passed against 0.1.0, whose breakage was
      # dev-server-side. Runtime behaviour in dev and production is verified
      # manually by mounting the installed package in a browser.
      - name: Assert the worker was bundled rather than left unresolved
        run: |
          set -euo pipefail
          cd /tmp/consumer
          ls dist/assets/ | grep -q pdf.worker \
            || { echo 'no pdf.worker asset was emitted'; exit 1; }
          if grep -rq '\.\./\.\./pdfjs-dist/build/pdf.worker' dist/assets/; then
            echo 'the worker specifier survived unbundled: new URL() was not rewritten'
            exit 1
          fi

  # FR-41's evidence. `verify` checks the source and the bundle; this checks the artefact, on a Node matrix,
  # because the one thing about dual output that is not ours to promise is whether `require()` can load it at
  # all: the engine peer is ESM-only with no `exports` map of its own, so that answer belongs to Node. The
  # answer is already fixed by the contract rather than open to measurement: `require(esm)` is unflagged in
  # every version §8 puts the floor at or above, so `scripts/tarball-check.mjs` treats an `ERR_REQUIRE_ESM`
  # here as a failure and refuses to run at all below the floor — the line it prints,
  # `require-esm-support=yes (15/15 on node X)`, is a record of which version certified that, not a probe of
  # versions the contract excludes.
  packaging:
    name: Packaging (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The contract floor and the two LTS lines above it. `PRD.md` §8 puts both Node rows at 22.13.0 and
        # FR-41 says flatly that Node 20 and 22.0–22.12 are not supported, so this job no longer measures
        # them: a row below the floor can only produce a pass that means nothing or a failure that means
        # nothing. The floor is where the promise starts, and `scripts/tarball-check.mjs` refuses to run
        # under it rather than reporting a result it cannot stand behind.
        node: ['22.13.0', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and pack
        run: npm run build

      # Both formats present, both declaration files, the same names through `require` and `import`.
      - name: Check the built package
        run: npm run check:packaging

      # Installs the tarball into a throwaway CommonJS project and resolves every published path from it.
      - name: Check the tarball
        run: npm run check:tarball

  # FR-48's evidence: the browser rows of `PRD.md` §8. jsdom is one engine and it rasterises no canvas,
  # knows no `devicePixelRatio`, dispatches no touch, ignores `forced-colors` and arbitrates no wheel —
  # which is every claim the table actually makes. This job serves the playground from source with the
  # engine's own support assets, so a request that leaves the machine is a finding rather than an accident
  # of the network.
  #
  # Three engines inside one job, no engine-agnostic split: the script prints a line per check per engine
  # *including the capabilities an engine refuses to emulate*, and a Firefox that will not show forced colours
  # is a result worth reading. Splitting engines across runners would turn that into three green jobs saying
  # nothing. A real-device pass is a separate row in §8 for a separate kind of evidence, and is not this job.
  #
  # The *engine* axis, by contrast, is a runner matrix (#194), because the clause asks for the published floor
  # and the latest supported 6.x to be **run**, not only built: `consumer` compiles against both ends and opens
  # neither, so a page painted at 6.2.108 existed only in a Chromium started by hand on the machine that wrote
  # this file. Same pair of versions as `consumer`, held honest by `scripts/check-docs.mjs`.
  browser:
    name: Browser matrix (Chromium, Firefox, WebKit, pdfjs-dist ${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: ['6.2.108', '6.4.299']
    env:
      PDFJS_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # WebKit is Safari's engine, which is what the macOS Safari row is claimed against; `--with-deps`
      # because WebKit's system libraries are not on the runner image.
      - name: Install browsers
        id: engines
        run: npx playwright install --with-deps chromium firefox webkit

      # The swap names the rest of its tree in the *same* install. `npm i` re-resolves every caret range in
      # `package.json`, and the react job learned that the hard way on 2026-10-06: leaving the dev tree out
      # moved axe-core and pdfjs-dist under a job that was supposed to be measuring one axis (#244). Then the
      # step reads the disk and refuses a cell that is not the cell the matrix asked for, so a green cell means
      # the painted page was built by the engine this row is claimed against.
      - name: Pin the engine to ${{ matrix.engine }}
        run: |
          set -euo pipefail
          PINS=$(node scripts/pin-tree.mjs pins --exclude=pdfjs-dist)
          npm i --no-save --no-package-lock --no-audit --no-fund pdfjs-dist@$PDFJS_ENGINE $PINS > /dev/null
          node scripts/pin-tree.mjs check --exact=pdfjs-dist=$PDFJS_ENGINE

      - name: Run the matrix
        run: npm run test:browsers

      # FR-45's automated leg, in a real layout: axe under jsdom cannot see colour contrast or geometry, so this
      # runs the same rule set inside each engine over a document whose AcroForm the engine has turned into HTML
      # controls, and refuses to write a record when any audit finds a violation. It runs in both engine cells on
      # purpose — the widget markup is the engine's, and #249 is the precedent for a floor-only a11y difference.
      # Read at the floor on this host on 2026-10-07 (pdfjs-dist@6.2.108 installed with the lockfile pins, and
      # `pin-tree.mjs check --exact` proving the cell): the same six audits, 0 violations, the same names and node
      # counts as at 6.3.289. So this cell buys the answer to a question #249 proved this axis can answer
      # differently, and it did not need a runner to ask it.
      #
      # `always()`, and the reason is a measurement: CI run 37816888885 (`dev` at de206ef) had one webkit row
      # fail — `print-carries-an-authored-mark`, #276's family — and because the steps run in order that single
      # red erased the accessibility record and the benchmark evidence for the whole job. Both steps refuse to
      # write their file when their own subject is bad, so neither can report clean about a broken run; the
      # gate that keeps them honest is inside them, not in the step before. The engines have to have installed,
      # which is what `steps.engines` is for: without them the run would only add a second red.
      - name: Accessibility audit in a real browser
        if: always() && steps.engines.outcome == 'success'
        run: npm run a11y:browser-record

      # FR-49's evidence, in the same job because it needs the same browser install. The script separates bars
      # (structural, and they fail the job) from measures (timings, printed with the machine they came from). A
      # timing is never compared against *another* machine's number — §6: "a maximum observed on one device does
      # not become a promise that a slower reader's machine will break" — but each one is compared against this
      # environment's own accepted baseline, and that comparison fails the job, which is FR-49's "a regression is
      # a failing job rather than a slower feeling". See `scripts/benchmark-baseline.mjs` for the tolerance and
      # for why an unaccepted leg is not a passing one.
      #
      # Twice, and both records uploaded: the baseline needs `minimumReadings` = 2 to know what this environment's
      # noise is, and two passes of the same tree minutes apart measure exactly that — machine noise, not a code
      # change. A `workflow_dispatch` seeding job was written first and does not work here: GitHub resolves the
      # trigger against the default branch, and `main` is nineteen commits behind `dev` with no
      # `workflow_dispatch` in its copy, so `gh workflow run` answers HTTP 404 (measured 2026-10-08). Uploading
      # the artifact from the job that already runs needs no new trigger, no write token, and no commit from CI —
      # `npm run bench:update-baseline -- --record <file>` is still the deliberate act, done by a person.
      #
      # That act has been done once: run 37819563810's two records are the entry for this runner's own
      # fingerprint, so from here a timing regression in this job is a failing job. A runner whose machine is
      # not in `benchmarks/baseline.json` still reads every leg n/a — the honest answer, and never a pass.
      - name: Run the benchmarks twice and keep both records
        id: bench
        # One cell, not two: §6's record is a reading of one machine per run, and the floor cell exists to
        # paint pages, not to re-time them. The version named here is the axis this job runs, and
        # `scripts/check-docs.mjs` refuses the pair if they ever disagree.
        if: always() && steps.engines.outcome == 'success' && matrix.engine == '6.4.299'
        run: |
          set -euo pipefail
          npm run bench
          cp benchmarks/latest.json benchmarks/ci-run-1.json
          npm run bench
      - name: Upload the records this machine measured
        # Its own condition rather than `always()`: a run whose bars broke or whose timings regressed is not a
        # baseline candidate, so the artifact exists only when the step above exited 0. The deliberate act stays
        # `npm run bench:update-baseline -- --record <file>`, run by a person on the downloaded file.
        if: steps.bench.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-records-pdfjs-dist-6.4.299
          path: |
            benchmarks/latest.json
            benchmarks/ci-run-1.json
          if-no-files-found: error
