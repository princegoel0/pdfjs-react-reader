name: CI

on:
  # `dev` is the integration branch; `main` only ever receives deliberate merges.
  push:
    branches: [main, dev]
  pull_request:

# A new push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Without this a step that never exits holds its runner for the 360-minute
    # default before GitHub cancels it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines requires >=20; 22 is the current LTS. Vite 7 refuses older
        # majors, so a lower version here would fail for the wrong reason.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      # The tarball is what consumers actually get; a stray import of a file
      # outside `files` type-checks fine and only breaks after publishing.
      - name: Pack
        run: npm pack --dry-run

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The docs site renders the built package, not the source, so this job
      # proves the shipped artifact works end to end.
      - name: Build library
        run: npm run build

      # `build:docs` must be a pure build: an earlier version chained
      # `vite preview`, which serves forever, so this step hung for six hours.
      - name: Build docs
        run: npm run build:docs
        env:
          DOC_TARGET: dist

      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/dist/
          retention-days: 7
